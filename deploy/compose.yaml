name: chatgpt-alerts
services:
  server:
    image: ${IMAGE_DIGEST:?Set an immutable IMAGE_DIGEST}
    env_file:
      - ${SERVER_ENV_FILE:?Set SERVER_ENV_FILE}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /data/alerts.sqlite
      SOURCES_FILE: /run/config/sources.json
    ports:
      - 127.0.0.1:${MCP_PORT:-8003}:3000
    volumes:
      - data:/data
      - type: bind
        source: ${SOURCES_FILE:?Set SOURCES_FILE}
        target: /run/config/sources.json
        read_only: true
    networks:
      integrations:
        aliases: [chatgpt-alerts]
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options: { max-size: 10m, max-file: '3' }
networks:
  integrations:
    external: true
    name: ${ALERTS_NETWORK:?Set the shared integrations Docker network}
volumes:
  data:
